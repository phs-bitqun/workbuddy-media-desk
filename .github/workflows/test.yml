name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 也跑：CSV 解析、复盘、导出、文件锁、HTTP 接口这些跟平台无关的必须过。
        # 只有「技能装法要 bash + ln -s」和「POSIX 权限位」在 Windows 上 skip，
        # 原因写在测试里，是显式跳过而不是隐藏失败。
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 跑测试
        shell: bash
        run: node --test tests/*.test.mjs
